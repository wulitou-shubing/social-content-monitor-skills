name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Skill structure
        run: python3 scripts/validate_repository.py
      - name: Validate example configuration
        run: python3 skills/social-content-monitor-to-lark/scripts/validate_config.py skills/social-content-monitor-to-lark/assets/config.example.json
      - name: Compile Python scripts
        run: python3 -m compileall -q skills scripts
